# Radar için proje ayarı. Codex bunu yalnız güvenilen projede okur.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Radar'ın kendi MCP sunucusu (araclar/mcp/radar-mcp.mjs)
[mcp_servers.radar]
command = "node"
args = ["araclar/mcp/radar-mcp.mjs"]
# radar_ozet metin döndürmez: onaysız. radar_alinti müşteri alıntısı döndürür: her çağrıda onay (K53).
default_tools_approval_mode = "prompt"

[mcp_servers.radar.tools.radar_ozet]
approval_mode = "approve"
